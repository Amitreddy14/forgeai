[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "forgeai"
version = "0.1.0"
description = "The agent that builds agents: generates, tests and improves grounded RAG agents from a one-paragraph brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amit Reddy" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
]

[project.scripts]
forge = "forgeai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT"]
ignore = ["B008", "SIM905"]  # B008: Typer/FastAPI defaults; SIM905: word lists read better as str.split()

[tool.ruff.lint.pycodestyle]
# The formatter wraps at 100; lint tolerates up to 120 for lines it cannot split
# (long f-strings and generator expressions).
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "fastembed", "fastembed.*", "docx", "docx.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
