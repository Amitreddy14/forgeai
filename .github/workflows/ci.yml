name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      FORGE_ENV: test
      FORGE_EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest --cov=forgeai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t forgeai:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name forge -p 7860:7860 -e FORGE_EMBEDDER=hash forgeai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/healthz; then
              curl -fsS http://localhost:7860/ > /dev/null && exit 0
            fi
            sleep 1
          done
          docker logs forge
          exit 1
